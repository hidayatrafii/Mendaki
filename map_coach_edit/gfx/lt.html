<!doctype html><html><head><meta charset="utf-8"><style>
/* doorstop lower third (navy box, amber accent, same type): left-aligned, sitting just above the single-line subtitles */
html,body{margin:0;width:1080px;height:1920px;background:transparent;font-family:"Helvetica Neue",Arial,sans-serif}
.lt{position:absolute;left:100px;bottom:686px;display:flex;flex-direction:column;align-items:stretch;text-align:left}
.box{background:rgba(10,30,60,.88);padding:16px 30px 16px 30px}
.bar{height:6px;background:#E8A317}
.name{color:#fff;font-size:42px;font-weight:700;letter-spacing:.4px;line-height:1.1;white-space:nowrap}
.des{color:#e6ecf3;font-size:25px;line-height:1.35;margin-top:6px;white-space:nowrap}
.yrs{color:#EEDCA2;font-size:28px;font-weight:700;line-height:1.35;margin-top:6px}
</style></head><body><div class="lt"><div class="box">
<div class="name" id="n"></div><div class="des" id="d"></div><div class="yrs" id="y"></div>
</div><div class="bar"></div></div></body></html>
