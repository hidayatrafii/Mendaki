<!doctype html><html><head><meta charset="utf-8"><style>
/* CTA end card - doorstop colours (navy / amber / cream / white) and Poppins; each part is exported as its own layer */
@font-face{font-family:P;src:url(../../fonts/Poppins-ExtraBold.ttf);font-weight:800}
@font-face{font-family:P;src:url(../../fonts/Poppins-SemiBold.ttf);font-weight:600}
html,body{margin:0;width:1080px;height:1920px;background:transparent;font-family:P}
.wrap{position:absolute;left:0;right:0;top:930px;transform:translateY(-50%);display:flex;justify-content:center}
.card{position:relative;width:800px;box-sizing:border-box;padding:60px 30px 64px;border-radius:28px;text-align:center}
.bg{position:absolute;inset:0;border-radius:28px;background:rgba(10,30,60,.94);box-shadow:0 16px 40px rgba(0,0,0,.4);
    border:3px solid rgba(238,220,162,.5);overflow:hidden}
.bg:before{content:"";position:absolute;left:0;right:0;top:0;height:12px;background:#E8A317}
.l1,.l3{position:relative;color:#fff;font-weight:600;font-size:52px;line-height:1.2}
.url{position:relative;display:inline-block;color:#EEDCA2;font-weight:800;font-size:66px;line-height:1.15;margin:22px 0 8px;white-space:nowrap;letter-spacing:.3px}
.ul{position:relative;height:10px;width:600px;margin:0 auto 30px;border-radius:5px;background:#E8A317}
.hide{visibility:hidden}
</style></head><body><div class="wrap"><div class="card">
<div class="bg" id="bg"></div>
<div class="l1" id="l1">Visit MENDAKI website at</div>
<div class="url" id="url">www.mendaki.org.sg</div>
<div class="ul" id="ul"></div>
<div class="l3" id="l3">to volunteer as a coach!</div>
</div></div></body></html>
