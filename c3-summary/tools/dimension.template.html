<template>
  <style>
    #root {
      position: absolute;
      inset: 0;
      font-family: "Montserrat", sans-serif;
      color: #fff;
      overflow: hidden;
    }
    /* soft dark pools behind each keyword only, placed with it (never over a face or the presenter) */
    #root .glow {
      position: absolute;
      left: 0;
      top: 0;
      width: 10px;
      height: 10px;
      background: radial-gradient(closest-side, rgba(16, 10, 46, 0.6), rgba(16, 10, 46, 0.36) 62%, rgba(16, 10, 46, 0));
    }
    #root .stage {
      position: absolute;
      inset: 0;
    }
    #root .w {
      position: absolute;
      left: 0;
      top: 0;
      white-space: nowrap;
    }
    #root .t {
      position: relative;
      z-index: 1;
      display: inline-block;
      font-weight: 800;
      line-height: 1.02;
      letter-spacing: -0.02em;
      text-wrap: balance;
    }
    /* word styles */
    #root .solid .t { color: #fff; font-weight: 900; text-shadow: 0 6px 30px rgba(10, 6, 30, 0.55); }
    #root .hero .t { color: #fff; font-weight: 900; letter-spacing: -0.035em; text-shadow: 0 8px 40px rgba(10, 6, 30, 0.6); }
    #root .plain .t { color: #fff; text-shadow: 0 5px 26px rgba(10, 6, 30, 0.6); }
    #root .outline .t { color: transparent; -webkit-text-stroke: 3px #fcd400; font-weight: 900; }
    #root .tag .t,
    #root .pill-gold .t { background: #fcd400; color: #1a1046; padding: 0.1em 0.42em 0.14em; border-radius: 14px; box-shadow: 0 10px 30px rgba(10, 6, 30, 0.35); }
    #root .pill-gold .t,
    #root .pill-white .t,
    #root .pill-ink .t { border-radius: 999px; padding: 0.14em 0.62em 0.2em; box-shadow: 0 12px 34px rgba(10, 6, 30, 0.4); }
    #root .pill-white .t { background: #fff; color: #1a1046; }
    #root .pill-ink .t { background: rgba(26, 16, 70, 0.94); color: #fff; border: 4px solid #fcd400; }
    #root .chip .t { color: #fcd400; border: 3px solid #fcd400; border-radius: 999px; padding: 0.12em 0.6em 0.16em; background: rgba(16, 10, 46, 0.55); }
    /* hand-drawn marker strokes */
    #root .mk {
      position: absolute;
      z-index: 0;
      overflow: visible;
      pointer-events: none;
    }
    #root .mk path {
      fill: none;
      stroke: #fcd400;
      stroke-linecap: round;
      stroke-linejoin: round;
      vector-effect: non-scaling-stroke;
    }
    #root .mk.swipe { left: -3%; top: 22%; width: 106%; height: 72%; }
    #root .mk.swipe path { stroke-width: 46px; opacity: 0.92; }
    #root .mk.circle { left: -8%; top: -20%; width: 116%; height: 144%; }
    #root .mk.circle path { stroke-width: 6px; }
    #root .mk.underline { left: -2%; top: 86%; width: 104%; height: 30px; }
    #root .mk.underline path { stroke-width: 8px; }
  </style>
  <div id="root" data-composition-id="__ID__" data-width="1920" data-height="1080"
    data-composition-variables='[]'>
    <div class="glow" id="__P__-g1" data-layout-ignore></div>
    <div class="glow" id="__P__-g2" data-layout-ignore></div>
    <div class="glow" id="__P__-g3" data-layout-ignore></div>
    <div class="stage" id="__P__-stage">
      <div class="w" id="__P__-w1"><span class="t" id="__P__-k1" data-var-text="k1">Keyword 1</span></div>
      <div class="w" id="__P__-w2"><span class="t" id="__P__-k2" data-var-text="k2">Keyword 2</span></div>
      <div class="w" id="__P__-w3"><span class="t" id="__P__-k3" data-var-text="k3">Keyword 3</span></div>
    </div>
  </div>
  <script>
    (function () {
      // layout, side, room beside the presenter, his box, the faces on screen and the card
      // length are written by tools/build-cards.mjs
      const v = __CFG__;
      __PLACE_RUNTIME__
      const root = document.getElementById("__P__-stage").parentElement;
      const $ = (s) => root.querySelector(s);
      const right = v.side === "right";
      const dur = Number(v.dur) || 5;
      const ws = [$("#__P__-w1"), $("#__P__-w2"), $("#__P__-w3")];
      const ts = [$("#__P__-k1"), $("#__P__-k2"), $("#__P__-k3")];
      const gs = [$("#__P__-g1"), $("#__P__-g2"), $("#__P__-g3")];
      const W = Math.max(380, Math.min(860, Number(v.width) || 860));
      const k = W / 860;

      // per layout: style, base size (px), indent from the outer edge, gap above, resting tilt, marker
      const LAYOUTS = {
        slam: [
          { cls: "solid", size: 132, indent: 0, gap: 0, rot: 0 },
          { cls: "tag", size: 56, indent: 110, gap: 26, rot: -3 },
          { cls: "outline", size: 104, indent: 30, gap: 22, rot: 0 },
        ],
        sticker: [
          { cls: "pill-gold", size: 66, indent: 0, gap: 0, rot: -5 },
          { cls: "pill-white", size: 66, indent: 210, gap: 34, rot: 4 },
          { cls: "pill-ink", size: 66, indent: 60, gap: 34, rot: -2.5 },
        ],
        marker: [
          { cls: "plain", size: 92, indent: 0, gap: 0, rot: 0, mark: "swipe" },
          { cls: "plain", size: 92, indent: 90, gap: 40, rot: 0, mark: "circle" },
          { cls: "plain", size: 92, indent: 20, gap: 40, rot: 0, mark: "underline" },
        ],
        hero: [
          { cls: "hero", size: 172, indent: 0, gap: 0, rot: -2 },
          { cls: "chip", size: 48, indent: 14, gap: 34, rot: 0 },
          { cls: "chip", size: 48, indent: 70, gap: 18, rot: 0 },
        ],
      };
      const PATHS = {
        swipe: "M2 60 C 22 54, 46 66, 70 58 S 92 56, 98 60",
        circle: "M52 6 C 82 3, 99 26, 97 50 C 95 80, 64 97, 38 95 C 12 93, 1 72, 3 48 C 5 22, 26 5, 60 9",
        underline: "M2 50 C 20 20, 38 80, 56 46 S 84 30, 98 52",
      };
      // each style's weight, letter-spacing (em), horizontal + vertical padding (em) and border (px)
      const STY = {
        solid: [900, -0.02, 0, 0, 0], hero: [900, -0.035, 0, 0, 0], plain: [800, -0.02, 0, 0, 0], outline: [900, -0.02, 0, 0, 0],
        tag: [800, -0.02, 0.84, 0.24, 0], "pill-gold": [800, -0.02, 1.24, 0.34, 0], "pill-white": [800, -0.02, 1.24, 0.34, 0],
        "pill-ink": [800, -0.02, 1.24, 0.34, 8], chip: [800, -0.02, 1.2, 0.28, 6],
      };
      const L = LAYOUTS[v.layout] || LAYOUTS.slam;
      const texts = ts.map((t) => t.textContent);

      L.forEach((c, i) => {
        ws[i].classList.add(c.cls);
        if (c.mark) {
          const NS = "http://www.w3.org/2000/svg";
          const svg = document.createElementNS(NS, "svg");
          svg.setAttribute("class", "mk " + c.mark);
          svg.setAttribute("viewBox", "0 0 100 100");
          svg.setAttribute("preserveAspectRatio", "none");
          const p = document.createElementNS(NS, "path");
          p.setAttribute("d", PATHS[c.mark]);
          svg.setAttribute("id", "__P__-m" + (i + 1));
          svg.appendChild(p);
          ws[i].insertBefore(svg, ws[i].firstChild);
        }
      });

      __fontsReady().then(() => {
        // base sizes: the largest that fits the room (whole phrase on one line for pills and
        // marker words; the longest word for the big styles, which may wrap)
        const base = L.map((c, i) => {
          const [wt, ls, ph, , bd] = STY[c.cls];
          const oneLine = !/solid|hero|outline/.test(c.cls);
          const room = Math.max(W, 640) - 20 - c.indent * k;
          const probe = oneLine ? texts[i] : texts[i].split(/\s+/).reduce((a, b) => (b.length > a.length ? b : a), "");
          let fs = c.size;
          while (fs > 40 && __textW(probe, wt, fs, ls) + ph * fs + bd > room) fs -= 2;
          return fs;
        });
        let FLOOR = 34;
        // each keyword's size at a given scale, from the font itself (no on-screen layout needed)
        const sizes = (s) => L.map((c, i) => {
          const [wt, ls, ph, pv, bd] = STY[c.cls];
          const fs = Math.max(FLOOR, base[i] * s), indent = c.indent * k * s; // small tags stay readable
          const oneLine = !/solid|hero|outline/.test(c.cls);
          const m = oneLine ? { lines: 1, w: __textW(texts[i], wt, fs, ls) } : __wrap(texts[i], wt, fs, Math.max(W, 640) - indent, ls);
          return { w: m.w + ph * fs + bd, h: m.lines * 1.02 * fs + pv * fs + bd + 0.12 * fs, indent, gap: i ? c.gap * s : 0, lines: m.lines, mw: m.w };
        });
        const edge = Number(v.edge) || 120;
        const xMin = right ? 1920 - edge - W : edge, xMax = right ? 1920 - edge : edge + W;
        const PAD = 26;
        const opts = { sizes, faces: v.faces || [], pres: v.pres || null, side: right ? "right" : "left",
          xMin, xMax, areaMin: 70, areaMax: 1850, yMin: 50, yMax: 890, prefY: 140, pad: PAD };
        // small words stay at 34 px or more; only where that can't clear every face do they go to 28 px
        let P = __placeItems(opts);
        if (!P || P.cost !== 0) { FLOOR = 28; P = __placeItems(opts); }
        P = P || { s: 0.67, cost: -1, items: L.map((c, i) => ({ x: xMin, y: 140 + i * 120, W: 400, H: 100 })) };
        const sz = sizes(P.s);
        L.forEach((c, i) => {
          const r = P.items[i];
          ts[i].style.fontSize = Math.max(FLOOR, base[i] * P.s) + "px";
          if (sz[i].lines > 1) { ts[i].style.whiteSpace = "normal"; ts[i].style.width = Math.ceil(sz[i].mw) + 4 + "px"; }
          Object.assign(ws[i].style, { left: r.x + PAD + "px", top: r.y + PAD + "px" });
          let g = [r.x - 30, r.y - 30, r.x + r.W + 30, r.y + r.H + 30];
          if (v.pres) { if (right) g[0] = Math.max(g[0], v.pres[2]); else g[2] = Math.min(g[2], v.pres[0]); }
          g = [Math.max(0, g[0]), Math.max(0, g[1]), Math.min(1920, g[2]), Math.min(1080, g[3])];
          Object.assign(gs[i].style, { left: g[0] + "px", top: g[1] + "px", width: g[2] - g[0] + "px", height: g[3] - g[1] + "px" });
        });
        // safety net: if no spot clears every face, the keywords sit this one out rather than cover anyone
        if (P.cost !== 0) root.style.display = "none";
        root.setAttribute("data-placed", JSON.stringify({ s: P.s, cost: P.cost, items: P.items.map((r) => [r.x, r.y, r.W, r.H].map(Math.round)) }));

        const gap = Math.min(1.0, Math.max(0.4, (dur - 2.0) / 3.2));
        const tl = gsap.timeline({ paused: true });
        if (v.cont) {
          // a card continuing past a cut: everything is already in place at its new spot
          tl.fromTo(["#__P__-stage", ...gs], { opacity: 0 }, { opacity: 1, duration: 0.12, ease: "power1.out" }, 0);
          L.forEach((c, i) => {
            tl.set(ws[i], { rotation: c.rot }, 0);
            if (c.cls === "outline") tl.set(ts[i], { color: "rgba(252,212,0,1)" }, 0);
            if (c.mark) tl.set("#__P__-m" + (i + 1), { clipPath: "inset(-20% -20% -20% -20%)" }, 0);
          });
        } else L.forEach((c, i) => {
          const t = 0.25 + i * gap;
          const w = ws[i];
          const el = ts[i];
          const sx = right ? 1 : -1;
          tl.fromTo(gs[i], { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.out" }, Math.max(0, t - 0.15));
          switch (c.cls) {
            case "solid":
            case "hero":
              tl.fromTo(w, { opacity: 0, scale: 1.45, rotation: c.rot, filter: "blur(14px)", transformOrigin: right ? "right center" : "left center" },
                { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.5, ease: "expo.out" }, t);
              break;
            case "tag":
              tl.fromTo(w, { opacity: 0, scale: 0.3, rotation: c.rot - 14 },
                { opacity: 1, scale: 1, rotation: c.rot, duration: 0.6, ease: "back.out(1.9)" }, t);
              break;
            case "outline":
              tl.fromTo(el, { clipPath: "inset(0% 100% 0% 0%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: 0.6, ease: "power3.out" }, t);
              tl.fromTo(el, { color: "rgba(252,212,0,0)" }, { color: "rgba(252,212,0,1)", duration: 0.45, ease: "power2.inOut" }, t + 0.55);
              break;
            case "pill-gold":
            case "pill-white":
            case "pill-ink":
              tl.fromTo(w, { opacity: 0, scale: 0.4, rotation: c.rot + sx * 16, y: 40 },
                { opacity: 1, scale: 1, rotation: c.rot, y: 0, duration: 0.6, ease: "back.out(1.7)" }, t);
              break;
            case "chip":
              tl.fromTo(w, { opacity: 0, x: sx * -60, filter: "blur(8px)" },
                { opacity: 1, x: 0, filter: "blur(0px)", duration: 0.45, ease: "expo.out" }, t);
              break;
            default: // plain + marker
              tl.fromTo(el, { opacity: 0, filter: "blur(10px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.25, ease: "power2.out" }, t);
          }
          if (c.mark) {
            // the stroke draws on left to right (the circle as a sweep)
            tl.fromTo("#__P__-m" + (i + 1), { clipPath: "inset(-20% 100% -20% -20%)" },
              { clipPath: "inset(-20% -20% -20% -20%)", duration: c.mark === "swipe" ? 0.4 : 0.55, ease: "power2.inOut" }, t + 0.2);
          }
        });

        const out = v.cont ? dur - 0.4 : Math.max(0.25 + 2 * gap + 0.9, dur - 0.4);
        if (v.last !== false) {
          tl.to("#__P__-stage", { opacity: 0, filter: "blur(8px)", duration: 0.3, ease: "power3.in" }, out);
          tl.to(gs, { opacity: 0, duration: 0.35, ease: "power2.in" }, out);
        }
        window.__timelines["__ID__"] = tl;
      });
    })();
  </script>
</template>
