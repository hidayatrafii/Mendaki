  <script>
    (function () {
      // layout, side, room beside the presenter, his box, the faces on screen and the card

      const v = {"dimension":"Safety","layout":"hero","side":"left","width":860,"edge":120,"dur":1.75,"cont":true,"last":false,"pres":[1242,268,1960,1080],"faces":[[1530,416,1711,697],[615,217,818,399],[993,546,1176,699],[1025,263,1205,410],[1211,203,1432,365],[1198,501,1413,657],[253,535,506,723],[864,241,1027,370],[634,471,851,634],[333,187,544,364]]};
      // Inlined into the keyword and subtitle scenes by the build scripts.
      // Finds where a block of text can sit without touching any face or the presenter.
      function __hit(a, b) {
        return Math.max(0, Math.min(a[2], b[2]) - Math.max(a[0], b[0])) * Math.max(0, Math.min(a[3], b[3]) - Math.max(a[1], b[1]));
      }
      // o: { measure(scale) -> {w, h}, faces, pres, side: "left"|"right"|"center",
      //      xMin, xMax, yMin, yMax, prefY, pad, scales, step }
      // Returns { x, y, s, cost, W, H }: the padded rectangle's top-left, the scale used, and
      // how much face area it still covers (0 = clear). Prefers the largest scale that is clear.

        const step = o.step || 12;

            const xs = [];

            else for (let k = 0; ; k++) {
              const x = o.side === "left" ? o.xMin + k * 24 : o.xMax - W - k * 24;
              if (x < o.xMin - 0.5 || x + W > o.xMax + 0.5) break;
              xs.push(x);
            }
            xs.forEach((x, k) => {
              if (x < o.xMin - 0.5 || x + W > o.xMax + 0.5) return;
              const r = [x, y, x + W, y + H];
              if (o.pres && __hit(r, o.pres) > 0) return;
              let cost = 0;
              for (const f of o.faces) cost += __hit(r, f);
              const pen = cost * 1000 + Math.abs(y - o.prefY) * 0.5 + k * 7 + (1 - s) * 4000;
              if (!found || pen < found.pen) found = { x, y, s, cost, pen, W, H };
            });
          }
          if (found && (!best || found.pen < best.pen)) best = found;
          if (found && found.cost === 0) break;
        }
        return best;
      }
      function __fontsReady() {
        const loads = ["500", "700", "800", "900"].map((w) => document.fonts.load(w + " 64px Montserrat").catch(() => null));
        return Promise.all(loads).then(() => document.fonts.ready);
      }
      // Text measured with the real font on a canvas: works even while a scene is hidden.
      const __ctx = document.createElement("canvas").getContext("2d");
      function __textW(text, weight, size, ls) {
        __ctx.font = weight + " " + size + "px Montserrat";
        return __ctx.measureText(text).width + (ls || 0) * size * text.length;
      }
      function __wrap(text, weight, size, maxW, ls) {
        const lines = [];
        let cur = "";
        for (const w of text.split(/\s+/)) {
          const t = cur ? cur + " " + w : w;
          if (cur && __textW(t, weight, size, ls) > maxW) { lines.push(cur); cur = w; } else cur = t;
        }
        if (cur) lines.push(cur);
        return { lines: lines.length, w: Math.max(...lines.map((l) => __textW(l, weight, size, ls))) };
      }
      // Places each keyword on its own: they stack like a block when there is room and spread
      // into the gaps between faces when there isn't. Never over the presenter or each other.
      // o: { sizes(s) -> [{ w, h, indent, gap }], faces, pres, side, xMin, xMax, yMin, yMax, prefY, pad, scales }
      // Returns { s, cost, items: [{ x, y, W, H }] } (padded rectangles), the largest clear scale.
      function __placeItems(o) {
        const scales = o.scales || [1, 0.88, 0.77, 0.67, 0.58, 0.5, 0.43];
        let best = null;
        for (const s of scales) {
          const items = o.sizes(s);
          const placed = [];
          let cost = 0, pen = 0, ok = true;
          for (let i = 0; i < items.length; i++) {
            const it = items[i];
            const W = it.w + 2 * o.pad, H = it.h + 2 * o.pad;
            // the preferred spot hugs this side's edge; any spot in the safe area is allowed
            const idealX = o.side === "right" ? o.xMax - it.indent - W : o.xMin + it.indent;
            const xLo = o.areaMin != null ? o.areaMin : o.xMin, xHi = o.areaMax != null ? o.areaMax : o.xMax;
            const idealY = i === 0 ? o.prefY : placed[i - 1].y + placed[i - 1].H - 2 * o.pad + it.gap;
            let f = null;
            for (let y = o.yMin; y + H <= o.yMax; y += 12) {
              for (let x = xLo; x + W <= xHi + 0.5; x += 24) {
                const r = [x, y, x + W, y + H];
                if (o.pres && __hit(r, o.pres) > 0) continue;
                if (placed.some((p) => __hit(r, [p.x + 10, p.y + 10, p.x + p.W - 10, p.y + p.H - 10]) > 0)) continue;
                let c = 0;
                for (const fc of o.faces) c += __hit(r, fc);
                const p2 = c * 1000 + Math.abs(y - idealY) * 0.6 + Math.abs(x - idealX) * 0.4;
                if (!f || p2 < f.p) f = { x, y, W, H, c, p: p2 };
              }
            }
            if (!f) { ok = false; break; }
            placed.push(f);
            cost += f.c;
            pen += f.p;
          }
          if (!ok) continue;
          const cand = { s, cost, items: placed, pen: pen + (1 - s) * 4000 };
          if (!best || cand.cost < best.cost || (cand.cost === best.cost && cand.pen < best.pen)) best = cand;
          if (cost === 0) break;
        }
        return best;
      }
      
      const root = document.getElementById("d12c-stage").parentElement;
      const $ = (s) => root.querySelector(s);
      const right = v.side === "right";
      const dur = Number(v.dur) || 5;
      const ws = [$("#d12c-w1"), $("#d12c-w2"), $("#d12c-w3")];
      const ts = [$("#d12c-k1"), $("#d12c-k2"), $("#d12c-k3")];
      const gs = [$("#d12c-g1"), $("#d12c-g2"), $("#d12c-g3")];
      const W = Math.max(380, Math.min(860, Number(v.width) || 860));
      const k = W / 860;

      // per layout: style, base size (px), indent from the outer edge, gap above, resting tilt, marker
      const LAYOUTS = {
        slam: [
          { cls: "solid", size: 132, indent: 0, gap: 0, rot: 0 },
          { cls: "tag", size: 56, indent: 110, gap: 26, rot: -3 },
          { cls: "outline", size: 104, indent: 30, gap: 22, rot: 0 },

          { cls: "pill-white", size: 66, indent: 210, gap: 34, rot: 4 },
          { cls: "pill-ink", size: 66, indent: 60, gap: 34, rot: -2.5 },

          { cls: "plain", size: 92, indent: 0, gap: 0, rot: 0, mark: "swipe" },
          { cls: "plain", size: 92, indent: 90, gap: 40, rot: 0, mark: "circle" },
          { cls: "plain", size: 92, indent: 20, gap: 40, rot: 0, mark: "underline" },
        ],
        hero: [
          { cls: "hero", size: 172, indent: 0, gap: 0, rot: -2 },
          { cls: "chip", size: 48, indent: 14, gap: 34, rot: 0 },
          { cls: "chip", size: 48, indent: 70, gap: 18, rot: 0 },
        ],
      };
      const PATHS = {
        swipe: "M2 60 C 22 54, 46 66, 70 58 S 92 56, 98 60",
        circle: "M52 6 C 82 3, 99 26, 97 50 C 95 80, 64 97, 38 95 C 12 93, 1 72, 3 48 C 5 22, 26 5, 60 9",
        underline: "M2 50 C 20 20, 38 80, 56 46 S 84 30, 98 52",
      };
      // each style's weight, letter-spacing (em), horizontal + vertical padding (em) and border (px)
      const STY = {
        solid: [900, -0.02, 0, 0, 0], hero: [900, -0.035, 0, 0, 0], plain: [800, -0.02, 0, 0, 0], outline: [900, -0.02, 0, 0, 0],
        tag: [800, -0.02, 0.84, 0.24, 0], "pill-gold": [800, -0.02, 1.24, 0.34, 0], "pill-white": [800, -0.02, 1.24, 0.34, 0],
        "pill-ink": [800, -0.02, 1.24, 0.34, 8], chip: [800, -0.02, 1.2, 0.28, 6],
      };
      const L = LAYOUTS[v.layout] || LAYOUTS.slam;
      const texts = ts.map((t) => t.textContent);

      L.forEach((c, i) => {
        ws[i].classList.add(c.cls);
        if (c.mark) {

          const svg = document.createElementNS(NS, "svg");
          svg.setAttribute("class", "mk " + c.mark);
          svg.setAttribute("viewBox", "0 0 100 100");
          svg.setAttribute("preserveAspectRatio", "none");
          const p = document.createElementNS(NS, "path");
          p.setAttribute("d", PATHS[c.mark]);
          svg.setAttribute("id", "d12c-m" + (i + 1));
          svg.appendChild(p);
          ws[i].insertBefore(svg, ws[i].firstChild);
        }
      });

      __fontsReady().then(() => {
        // base sizes: the largest that fits the room (whole phrase on one line for pills and
        // marker words; the longest word for the big styles, which may wrap)
        const base = L.map((c, i) => {
          const [wt, ls, ph, , bd] = STY[c.cls];
          const oneLine = !/solid|hero|outline/.test(c.cls);
          const room = Math.max(W, 640) - 20 - c.indent * k;
          const probe = oneLine ? texts[i] : texts[i].split(/\s+/).reduce((a, b) => (b.length > a.length ? b : a), "");
          let fs = c.size;
          while (fs > 40 && __textW(probe, wt, fs, ls) + ph * fs + bd > room) fs -= 2;
          return fs;
        });
        let FLOOR = 34;
        // each keyword's size at a given scale, from the font itself (no on-screen layout needed)
        const sizes = (s) => L.map((c, i) => {
          const [wt, ls, ph, pv, bd] = STY[c.cls];
          const fs = Math.max(FLOOR, base[i] * s), indent = c.indent * k * s; // small tags stay readable
          const oneLine = !/solid|hero|outline/.test(c.cls);
          const m = oneLine ? { lines: 1, w: __textW(texts[i], wt, fs, ls) } : __wrap(texts[i], wt, fs, Math.max(W, 640) - indent, ls);
          return { w: m.w + ph * fs + bd, h: m.lines * 1.02 * fs + pv * fs + bd + 0.12 * fs, indent, gap: i ? c.gap * s : 0, lines: m.lines, mw: m.w };
        });

        // small words stay at 34 px or more; only where that can't clear every face do they go to 28 px
        let P = __placeItems(opts);

        P = P || { s: 0.67, cost: -1, items: L.map((c, i) => ({ x: xMin, y: 140 + i * 120, W: 400, H: 100 })) };
        const sz = sizes(P.s);
        L.forEach((c, i) => {
          const r = P.items[i];
          ts[i].style.fontSize = Math.max(FLOOR, base[i] * P.s) + "px";
          if (sz[i].lines > 1) { ts[i].style.whiteSpace = "normal"; ts[i].style.width = Math.ceil(sz[i].mw) + 4 + "px"; }
          Object.assign(ws[i].style, { left: r.x + PAD + "px", top: r.y + PAD + "px" });
          let g = [r.x - 30, r.y - 30, r.x + r.W + 30, r.y + r.H + 30];
          if (v.pres) { if (right) g[0] = Math.max(g[0], v.pres[2]); else g[2] = Math.min(g[2], v.pres[0]); }
          g = [Math.max(0, g[0]), Math.max(0, g[1]), Math.min(1920, g[2]), Math.min(1080, g[3])];
          Object.assign(gs[i].style, { left: g[0] + "px", top: g[1] + "px", width: g[2] - g[0] + "px", height: g[3] - g[1] + "px" });
        });

        if (P.cost !== 0) root.style.display = "none";
        root.setAttribute("data-placed", JSON.stringify({ s: P.s, cost: P.cost, items: P.items.map((r) => [r.x, r.y, r.W, r.H].map(Math.round)) }));

        const gap = Math.min(1.0, Math.max(0.4, (dur - 2.0) / 3.2));
        const tl = gsap.timeline({ paused: true });
        if (v.cont) {

          tl.fromTo(["#d12c-stage", ...gs], { opacity: 0 }, { opacity: 1, duration: 0.12, ease: "power1.out" }, 0);
          L.forEach((c, i) => {
            tl.set(ws[i], { rotation: c.rot }, 0);
            if (c.cls === "outline") tl.set(ts[i], { color: "rgba(252,212,0,1)" }, 0);
            if (c.mark) tl.set("#d12c-m" + (i + 1), { clipPath: "inset(-20% -20% -20% -20%)" }, 0);
          });
        } else L.forEach((c, i) => {
          const t = 0.25 + i * gap;
          const w = ws[i];
          const el = ts[i];
          const sx = right ? 1 : -1;
          tl.fromTo(gs[i], { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.out" }, Math.max(0, t - 0.15));
          switch (c.cls) {
            case "solid":
            case "hero":
              tl.fromTo(w, { opacity: 0, scale: 1.45, rotation: c.rot, filter: "blur(14px)", transformOrigin: right ? "right center" : "left center" },
                { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.5, ease: "expo.out" }, t);

            case "tag":
              tl.fromTo(w, { opacity: 0, scale: 0.3, rotation: c.rot - 14 },
                { opacity: 1, scale: 1, rotation: c.rot, duration: 0.6, ease: "back.out(1.9)" }, t);
              break;
            case "outline":
              tl.fromTo(el, { clipPath: "inset(0% 100% 0% 0%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: 0.6, ease: "power3.out" }, t);
              tl.fromTo(el, { color: "rgba(252,212,0,0)" }, { color: "rgba(252,212,0,1)", duration: 0.45, ease: "power2.inOut" }, t + 0.55);
              break;
            case "pill-gold":
            case "pill-white":
            case "pill-ink":
              tl.fromTo(w, { opacity: 0, scale: 0.4, rotation: c.rot + sx * 16, y: 40 },
                { opacity: 1, scale: 1, rotation: c.rot, y: 0, duration: 0.6, ease: "back.out(1.7)" }, t);
              break;
            case "chip":
              tl.fromTo(w, { opacity: 0, x: sx * -60, filter: "blur(8px)" },
                { opacity: 1, x: 0, filter: "blur(0px)", duration: 0.45, ease: "expo.out" }, t);

              tl.fromTo(el, { opacity: 0, filter: "blur(10px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.25, ease: "power2.out" }, t);
          }

            tl.fromTo("#d12c-m" + (i + 1), { clipPath: "inset(-20% 100% -20% -20%)" },

      });
    })();
