<template>
  <style>
    #root {
      position: absolute;
      inset: 0;
      font-family: "Poppins", sans-serif;
      color: #fff;
      overflow: hidden;
    }
    /* soft dark pools behind each text block, placed with it (tools/build-titles.mjs) */
    #root .glow {
      position: absolute;
      left: 0;
      top: 0;
      width: 10px;
      height: 10px;
      background: radial-gradient(closest-side, rgba(26, 27, 30, 0.62), rgba(26, 27, 30, 0.38) 62%, rgba(26, 27, 30, 0));
    }
    #root .block {
      position: absolute;
      left: 96px;
      top: 300px;
    }
    #root .year {
      display: flex;
      font-size: 138px;
      font-weight: 800;
      line-height: 1;
      letter-spacing: -0.03em;
      color: #fdd901;
    }
    #root .digit {
      display: inline-block;
      overflow: hidden;
      padding: 0 2px 10px;
    }
    #root .digit span {
      display: inline-block;
    }
    #root .tag {
      margin-top: 18px;
      width: 350px;
      font-size: 40px;
      font-weight: 700;
      line-height: 1.12;
      text-shadow: 0 4px 22px rgba(0, 0, 0, 0.6);
    }
    #root .tag .w {
      display: inline-block;
      margin-right: 0.24em;
    }
    #root .tag .gold {
      color: #fdd901;
    }
  </style>
  <div id="root" data-composition-id="opening" data-width="1920" data-height="1080">
    <div class="glow" id="op-glow-a" data-layout-ignore></div>

    <div class="block" id="op-a">
      <div class="year" id="op-year">
        <span class="digit"><span id="op-d1">2</span></span>
        <span class="digit"><span id="op-d2">0</span></span>
        <span class="digit"><span id="op-d3">2</span></span>
        <span class="digit"><span id="op-d4">6</span></span>
      </div>
      <div class="tag" id="op-tag">
        <span class="w" id="op-w1">A</span><span class="w" id="op-w2">year</span><span class="w" id="op-w3">of</span><span class="w" id="op-w4">moving</span><span class="w" id="op-w5">forward,</span><span class="w gold" id="op-w6">together.</span>
      </div>
    </div>

  </div>
  <script>
    (function () {
      /*@runtime*/
      // Inlined into the keyword and subtitle scenes by the build scripts.
      // Finds where a block of text can sit without touching any face or the presenter.
      function __hit(a, b) {
        return Math.max(0, Math.min(a[2], b[2]) - Math.max(a[0], b[0])) * Math.max(0, Math.min(a[3], b[3]) - Math.max(a[1], b[1]));
      }
      // o: { measure(scale) -> {w, h}, faces, pres, side: "left"|"right"|"center",
      //      xMin, xMax, yMin, yMax, prefY, pad, scales, step }
      // Returns { x, y, s, cost, W, H }: the padded rectangle's top-left, the scale used, and
      // how much face area it still covers (0 = clear). Prefers the largest scale that is clear.
      function __placeBlock(o) {
        const scales = o.scales || [1, 0.88, 0.77, 0.67, 0.58];
        const step = o.step || 12;
        let best = null;
        for (const s of scales) {
          const m = o.measure(s);
          const W = m.w + 2 * o.pad, H = m.h + 2 * o.pad;
          let found = null;
          for (let y = o.yMin; y + H <= o.yMax; y += step) {
            const xs = [];
            if (o.side === "center") xs.push((o.xMin + o.xMax) / 2 - W / 2);
            else for (let k = 0; ; k++) {
              const x = o.side === "left" ? o.xMin + k * 24 : o.xMax - W - k * 24;
              if (x < o.xMin - 0.5 || x + W > o.xMax + 0.5) break;
              xs.push(x);
            }
            xs.forEach((x, k) => {
              if (x < o.xMin - 0.5 || x + W > o.xMax + 0.5) return;
              const r = [x, y, x + W, y + H];
              if (o.pres && __hit(r, o.pres) > 0) return;
              let cost = 0;
              for (const f of o.faces) cost += __hit(r, f);
              const pen = cost * 1000 + Math.abs(y - o.prefY) * 0.5 + k * 7 + (1 - s) * 4000;
              if (!found || pen < found.pen) found = { x, y, s, cost, pen, W, H };
            });
          }
          if (found && (!best || found.pen < best.pen)) best = found;
          if (found && found.cost === 0) break;
        }
        return best;
      }
      function __fontsReady() {
        const loads = ["500", "700", "800", "900"].map((w) => document.fonts.load(w + " 64px Poppins").catch(() => null));
        return Promise.all(loads).then(() => document.fonts.ready);
      }
      // Text measured with the real font on a canvas: works even while a scene is hidden.
      const __ctx = document.createElement("canvas").getContext("2d");
      function __textW(text, weight, size, ls) {
        __ctx.font = weight + " " + size + "px Poppins";
        return __ctx.measureText(text).width + (ls || 0) * size * text.length;
      }
      function __wrap(text, weight, size, maxW, ls) {
        const lines = [];
        let cur = "";
        for (const w of text.split(/\s+/)) {
          const t = cur ? cur + " " + w : w;
          if (cur && __textW(t, weight, size, ls) > maxW) { lines.push(cur); cur = w; } else cur = t;
        }
        if (cur) lines.push(cur);
        return { lines: lines.length, w: Math.max(...lines.map((l) => __textW(l, weight, size, ls))) };
      }
      // Places each keyword on its own: they stack like a block when there is room and spread
      // into the gaps between faces when there isn't. Never over the presenter or each other.
      // o: { sizes(s) -> [{ w, h, indent, gap }], faces, pres, side, xMin, xMax, yMin, yMax, prefY, pad, scales }
      // Returns { s, cost, items: [{ x, y, W, H }] } (padded rectangles), the largest clear scale.
      function __placeItems(o) {
        const scales = o.scales || [1, 0.88, 0.77, 0.67, 0.58, 0.5, 0.43];
        let best = null;
        for (const s of scales) {
          const items = o.sizes(s);
          const placed = [];
          let cost = 0, pen = 0, ok = true;
          for (let i = 0; i < items.length; i++) {
            const it = items[i];
            const W = it.w + 2 * o.pad, H = it.h + 2 * o.pad;
            // the preferred spot hugs this side's edge; any spot in the safe area is allowed
            const idealX = o.side === "right" ? o.xMax - it.indent - W : o.xMin + it.indent;
            const xLo = o.areaMin != null ? o.areaMin : o.xMin, xHi = o.areaMax != null ? o.areaMax : o.xMax;
            const idealY = i === 0 ? o.prefY : placed[i - 1].y + placed[i - 1].H - 2 * o.pad + it.gap;
            let f = null;
            for (let y = o.yMin; y + H <= o.yMax; y += 12) {
              for (let x = xLo; x + W <= xHi + 0.5; x += 24) {
                const r = [x, y, x + W, y + H];
                if (o.pres && __hit(r, o.pres) > 0) continue;
                if (placed.some((p) => __hit(r, [p.x + 10, p.y + 10, p.x + p.W - 10, p.y + p.H - 10]) > 0)) continue;
                let c = 0;
                for (const fc of o.faces) c += __hit(r, fc);
                const p2 = c * 1000 + Math.abs(y - idealY) * 0.6 + Math.abs(x - idealX) * 0.4;
                if (!f || p2 < f.p) f = { x, y, W, H, c, p: p2 };
              }
            }
            if (!f) { ok = false; break; }
            placed.push(f);
            cost += f.c;
            pen += f.p;
          }
          if (!ok) continue;
          const cand = { s, cost, items: placed, pen: pen + (1 - s) * 4000 };
          if (!best || cand.cost < best.cost || (cand.cost === best.cost && cand.pen < best.pen)) best = cand;
          if (cost === 0) break;
        }
        return best;
      }
      /*@end-runtime*/
      // faces on screen while each block shows, and the presenter's box (tools/build-titles.mjs)
      const PLACE = /*@place*/ {"a":{"faces":[],"pres":null,"prefY":300}} /*@end-place*/;
      const blocks = [
        ["#op-a", "#op-glow-a", PLACE.a],
      ];
      __fontsReady().then(() => {
        blocks.forEach(([sel, glowSel, p]) => {
          if (!p) return;
          const el = document.querySelector(sel);
          const P = __placeBlock({
            // sized from the font (works even while the scene is hidden): "2026" over the wrapped tagline
            measure: (s) => {
              const tag = __wrap("A year of moving forward, together.", 700, 40, 350, 0);
              const w = Math.max(__textW("2026", 800, 138, -0.03) + 16, tag.w);
              return { w: w * s, h: (148 + 18 + tag.lines * 40 * 1.12) * s };
            },
            faces: p.faces, pres: p.pres, side: "left", xMin: 96, xMax: p.pres ? p.pres[0] : 1824,
            yMin: 60, yMax: 880, prefY: p.prefY, pad: 24,
          });
          el.style.transformOrigin = "0 0";
          el.style.transform = "scale(" + P.s + ")";
          el.style.left = P.x + 24 + "px";
          el.style.top = P.y + 24 + "px";
          el.setAttribute("data-cost", Math.round(P.cost) + "@" + P.s);
          let g = [P.x - 50, P.y - 50, P.x + P.W + 50, P.y + P.H + 50];
          if (p.pres) g[2] = Math.min(g[2], p.pres[0]);
          g = [Math.max(0, g[0]), Math.max(0, g[1]), Math.min(1920, g[2]), Math.min(1080, g[3])];
          Object.assign(document.querySelector(glowSel).style, { left: g[0] + "px", top: g[1] + "px", width: g[2] - g[0] + "px", height: g[3] - g[1] + "px" });
        });

        const tl = gsap.timeline({ paused: true });
        const blurIn = (sel, t, d = 0.22) =>
          tl.fromTo(sel, { opacity: 0, filter: "blur(10px)" },
            { opacity: 1, filter: "blur(0px)", duration: d, ease: "power2.out" }, t);

        tl.fromTo("#op-glow-a", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.out" }, 3.0);
        // "2026" lands with the first spoken word
        tl.fromTo(["#op-d1", "#op-d2", "#op-d3", "#op-d4"], { yPercent: 110 },
          { yPercent: 0, duration: 0.8, ease: "expo.out", stagger: 0.09 }, 3.2);
        // "has been a year of moving forward together"
        // each word lands as it is spoken (voice starts at 3.28 s)
        ["#op-w1", "#op-w2", "#op-w3", "#op-w4", "#op-w5"].forEach((s, i) => blurIn(s, [4.95, 5.02, 5.29, 5.44, 5.9][i]));
        tl.fromTo("#op-w6", { opacity: 0, filter: "blur(12px)", scale: 1.15 },
          { opacity: 1, filter: "blur(0px)", scale: 1, duration: 0.45, ease: "expo.out" }, 6.37);
        tl.to(["#op-a", "#op-glow-a"], { opacity: 0, filter: "blur(8px)", duration: 0.12, ease: "power3.in" }, 6.74);

        window.__timelines["opening"] = tl;
      });
    })();
  </script>
</template>
