<template>
  <style>
    #root {
      position: absolute;
      inset: 0;
      font-family: "Montserrat", sans-serif;
      color: #fff;
      overflow: hidden;
    }
    /* the glow darkens only the empty side of the frame and fades out before it
       reaches the presenter, so it always sits behind him */
    #root .glow {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 0;
      width: 900px;
      background: linear-gradient(to right, rgba(16, 10, 46, 0.8) 0%, rgba(16, 10, 46, 0.55) 55%, rgba(16, 10, 46, 0) 100%);
    }
    #root.right .glow {
      left: auto;
      right: 0;
      background: linear-gradient(to left, rgba(16, 10, 46, 0.8) 0%, rgba(16, 10, 46, 0.55) 55%, rgba(16, 10, 46, 0) 100%);
    }
    #root .stage {
      position: absolute;
      top: 140px;
      left: 120px;
      width: 860px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }
    #root.right .stage {
      left: auto;
      right: 120px;
      align-items: flex-end;
      text-align: right;
    }
    #root .w {
      position: relative;
      max-width: 860px;
    }
    #root .t {
      position: relative;
      z-index: 1;
      display: inline-block;
      font-weight: 800;
      line-height: 1.02;
      letter-spacing: -0.02em;
      text-wrap: balance;
    }
    /* word styles */
    #root .solid .t { color: #fff; font-weight: 900; text-shadow: 0 6px 30px rgba(10, 6, 30, 0.55); }
    #root .hero .t { color: #fff; font-weight: 900; letter-spacing: -0.035em; text-shadow: 0 8px 40px rgba(10, 6, 30, 0.6); }
    #root .plain .t { color: #fff; text-shadow: 0 5px 26px rgba(10, 6, 30, 0.6); }
    #root .outline .t { color: transparent; -webkit-text-stroke: 3px #fcd400; font-weight: 900; }
    #root .tag .t,
    #root .pill-gold .t { background: #fcd400; color: #1a1046; padding: 0.1em 0.42em 0.14em; border-radius: 14px; box-shadow: 0 10px 30px rgba(10, 6, 30, 0.35); }
    #root .pill-gold .t,
    #root .pill-white .t,
    #root .pill-ink .t { border-radius: 999px; padding: 0.14em 0.62em 0.2em; box-shadow: 0 12px 34px rgba(10, 6, 30, 0.4); }
    #root .pill-white .t { background: #fff; color: #1a1046; }
    #root .pill-ink .t { background: rgba(26, 16, 70, 0.94); color: #fff; border: 4px solid #fcd400; }
    #root .chip .t { color: #fcd400; border: 3px solid #fcd400; border-radius: 999px; padding: 0.12em 0.6em 0.16em; background: rgba(16, 10, 46, 0.55); }
    /* hand-drawn marker strokes */
    #root .mk {
      position: absolute;
      z-index: 0;
      overflow: visible;
      pointer-events: none;
    }
    #root .mk path {
      fill: none;
      stroke: #fcd400;
      stroke-linecap: round;
      stroke-linejoin: round;
      vector-effect: non-scaling-stroke;
    }
    #root .mk.swipe { left: -3%; top: 22%; width: 106%; height: 72%; }
    #root .mk.swipe path { stroke-width: 46px; opacity: 0.92; }
    #root .mk.circle { left: -8%; top: -20%; width: 116%; height: 144%; }
    #root .mk.circle path { stroke-width: 6px; }
    #root .mk.underline { left: -2%; top: 86%; width: 104%; height: 30px; }
    #root .mk.underline path { stroke-width: 8px; }
  </style>
  <div id="root" data-composition-id="dim-12" data-width="1920" data-height="1080"
    data-composition-variables='[{"id":"k1","type":"string","label":"Keyword 1","default":"Safe Workplace"},{"id":"k2","type":"string","label":"Keyword 2","default":"Awareness"},{"id":"k3","type":"string","label":"Keyword 3","default":"Support"}]'>
    <div class="glow" id="d12-glow" data-layout-ignore></div>
    <div class="stage" id="d12-stage">
      <div class="w" id="d12-w1"><span class="t" id="d12-k1" data-var-text="k1">Safe Workplace</span></div>
      <div class="w" id="d12-w2"><span class="t" id="d12-k2" data-var-text="k2">Awareness</span></div>
      <div class="w" id="d12-w3"><span class="t" id="d12-k3" data-var-text="k3">Support</span></div>
    </div>
  </div>
  <script>
    (function () {
      // layout, side and card length are written by tools/build-cards.mjs
      const v = {"dimension":"Safety","layout":"hero","side":"left","width":860,"glow":1100,"edge":120,"dur":6.9,"cont":false,"last":true};
      const root = document.getElementById("d12-stage").parentElement;
      const $ = (s) => root.querySelector(s);
      const right = v.side === "right";
      if (right) root.classList.add("right");
      const dur = Number(v.dur) || 5;
      const ws = [$("#d12-w1"), $("#d12-w2"), $("#d12-w3")];
      const ts = [$("#d12-k1"), $("#d12-k2"), $("#d12-k3")];
      // free width beside the presenter for this card (from assets/character-track.json)
      const W = Math.max(380, Math.min(860, Number(v.width) || 860));
      const k = W / 860;
      $("#d12-stage").style.width = W + "px";
      $("#d12-stage").style[right ? "right" : "left"] = (Number(v.edge) || 120) + "px";
      $("#d12-glow").style.width = (Number(v.glow) || 900) + "px";

      // per layout: style, base size (px), indent from the outer edge, gap above, resting tilt, marker
      const LAYOUTS = {
        slam: [
          { cls: "solid", size: 132, indent: 0, gap: 0, rot: 0 },
          { cls: "tag", size: 56, indent: 110, gap: 26, rot: -3 },
          { cls: "outline", size: 104, indent: 30, gap: 22, rot: 0 },
        ],
        sticker: [
          { cls: "pill-gold", size: 66, indent: 0, gap: 0, rot: -5 },
          { cls: "pill-white", size: 66, indent: 210, gap: 34, rot: 4 },
          { cls: "pill-ink", size: 66, indent: 60, gap: 34, rot: -2.5 },
        ],
        marker: [
          { cls: "plain", size: 92, indent: 0, gap: 0, rot: 0, mark: "swipe" },
          { cls: "plain", size: 92, indent: 90, gap: 40, rot: 0, mark: "circle" },
          { cls: "plain", size: 92, indent: 20, gap: 40, rot: 0, mark: "underline" },
        ],
        hero: [
          { cls: "hero", size: 172, indent: 0, gap: 0, rot: -2 },
          { cls: "chip", size: 48, indent: 14, gap: 34, rot: 0 },
          { cls: "chip", size: 48, indent: 70, gap: 18, rot: 0 },
        ],
      };
      const PATHS = {
        swipe: "M2 60 C 22 54, 46 66, 70 58 S 92 56, 98 60",
        circle: "M52 6 C 82 3, 99 26, 97 50 C 95 80, 64 97, 38 95 C 12 93, 1 72, 3 48 C 5 22, 26 5, 60 9",
        underline: "M2 50 C 20 20, 38 80, 56 46 S 84 30, 98 52",
      };
      const L = LAYOUTS[v.layout] || LAYOUTS.slam;

      const fit = (text, size, maxW, oneLine) => {
        // largest size (<= base) that fits: the whole phrase on one line for pills and
        // marker words, or its longest word for the big styles (those may wrap)
        const probe = oneLine ? text : text.split(/\s+/).reduce((a, b) => (b.length > a.length ? b : a), "");
        const hf = window.__hyperframes;
        if (hf && typeof hf.fitTextFontSize === "function") {
          try {
            const r = hf.fitTextFontSize(probe, { fontFamily: "Montserrat", fontWeight: 900, maxWidth: maxW, baseFontSize: size, minFontSize: 40, step: 2 });
            if (r && r.fontSize) return Math.min(size, r.fontSize);
          } catch (e) {}
        }
        return Math.max(40, Math.min(size, Math.floor(maxW / (probe.length * 0.7))));
      };

      L.forEach((c, i) => {
        const w = ws[i];
        w.classList.add(c.cls);
        const indent = Math.round(c.indent * k);
        w.style[right ? "marginRight" : "marginLeft"] = indent + "px";
        w.style.maxWidth = W + "px";
        w.style.marginTop = c.gap + "px";
        const pad = /pill|tag|chip/.test(c.cls) ? 0.82 : 1; // pills spend width on padding
        const oneLine = !/solid|hero|outline/.test(c.cls);
        if (oneLine) ts[i].style.whiteSpace = "nowrap";
        ts[i].style.fontSize = fit(ts[i].textContent, c.size, (W - 20 - indent) * pad, oneLine) + "px";
        if (c.mark) {
          const NS = "http://www.w3.org/2000/svg";
          const svg = document.createElementNS(NS, "svg");
          svg.setAttribute("class", "mk " + c.mark);
          svg.setAttribute("viewBox", "0 0 100 100");
          svg.setAttribute("preserveAspectRatio", "none");
          const p = document.createElementNS(NS, "path");
          p.setAttribute("d", PATHS[c.mark]);
          svg.setAttribute("id", "d12-m" + (i + 1));
          svg.appendChild(p);
          w.insertBefore(svg, w.firstChild);
        }
      });

      const gap = Math.min(1.0, Math.max(0.4, (dur - 2.0) / 3.2));
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#d12-glow", { opacity: 0 }, { opacity: 1, duration: v.cont ? 0.12 : 0.6, ease: "power2.out" }, 0);

      if (v.cont) {
        // second half of a card split at a camera cut: everything is already in place
        tl.fromTo("#d12-stage", { opacity: 0 }, { opacity: 1, duration: 0.12, ease: "power1.out" }, 0);
        L.forEach((c, i) => {
          tl.set(ws[i], { rotation: c.rot }, 0);
          if (c.cls === "outline") tl.set(ts[i], { color: "rgba(252,212,0,1)" }, 0);
          if (c.mark) tl.set("#d12-m" + (i + 1), { clipPath: "inset(-20% -20% -20% -20%)" }, 0);
        });
      }
      if (!v.cont) L.forEach((c, i) => {
        const t = 0.25 + i * gap;
        const w = ws[i];
        const el = ts[i];
        const sx = right ? 1 : -1;
        switch (c.cls) {
          case "solid":
          case "hero":
            tl.fromTo(w, { opacity: 0, scale: 1.45, rotation: c.rot, filter: "blur(14px)", transformOrigin: right ? "right center" : "left center" },
              { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.5, ease: "expo.out" }, t);
            break;
          case "tag":
            tl.fromTo(w, { opacity: 0, scale: 0.3, rotation: c.rot - 14 },
              { opacity: 1, scale: 1, rotation: c.rot, duration: 0.6, ease: "back.out(1.9)" }, t);
            break;
          case "outline":
            tl.fromTo(el, { clipPath: "inset(0% 100% 0% 0%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: 0.6, ease: "power3.out" }, t);
            tl.fromTo(el, { color: "rgba(252,212,0,0)" }, { color: "rgba(252,212,0,1)", duration: 0.45, ease: "power2.inOut" }, t + 0.55);
            break;
          case "pill-gold":
          case "pill-white":
          case "pill-ink":
            tl.fromTo(w, { opacity: 0, scale: 0.4, rotation: c.rot + sx * 16, y: 40 },
              { opacity: 1, scale: 1, rotation: c.rot, y: 0, duration: 0.6, ease: "back.out(1.7)" }, t);
            break;
          case "chip":
            tl.fromTo(w, { opacity: 0, x: sx * -60, filter: "blur(8px)" },
              { opacity: 1, x: 0, filter: "blur(0px)", duration: 0.45, ease: "expo.out" }, t);
            break;
          default: // plain + marker
            tl.fromTo(el, { opacity: 0, filter: "blur(10px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.25, ease: "power2.out" }, t);
        }
        if (c.mark) {
          // the stroke draws on left to right (the circle as a sweep)
          tl.fromTo("#d12-m" + (i + 1), { clipPath: "inset(-20% 100% -20% -20%)" },
            { clipPath: "inset(-20% -20% -20% -20%)", duration: c.mark === "swipe" ? 0.4 : 0.55, ease: "power2.inOut" }, t + 0.2);
        }
      });

      const out = v.cont ? dur - 0.4 : Math.max(0.25 + 2 * gap + 0.9, dur - 0.4);
      if (v.last !== false) tl.to("#d12-stage", { opacity: 0, scale: 0.94, filter: "blur(8px)", duration: 0.3, ease: "power3.in",
        transformOrigin: right ? "right center" : "left center" }, out);
      if (v.last !== false) tl.to("#d12-glow", { opacity: 0, duration: 0.35, ease: "power2.in" }, out);
      window.__timelines["dim-12"] = tl;
    })();
  </script>
</template>
