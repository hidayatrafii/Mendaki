  </style>
  <div
    id="root"
    data-composition-id="dim-08"
    data-width="1920"
    data-height="1080"
    data-composition-variables='[{"id":"num","type":"string","label":"Sequence number","default":"08 / 17"},{"id":"label","type":"string","label":"Dimension","default":"Development"},{"id":"k1","type":"string","label":"Keyword 1","default":"Learning"},{"id":"k2","type":"string","label":"Keyword 2","default":"Growth"},{"id":"k3","type":"string","label":"Keyword 3","default":"Opportunities"}]'
  >
    <div class="scrim" id="d08-scrim"></div>
    <div class="block" id="d08-block">
      <div class="ghost" id="d08-ghost" data-layout-ignore></div>
      <div class="chip">
        <span class="num" id="d08-num" data-var-text="num">08 / 17</span>
        <span class="bar" id="d08-bar"></span>
        <span class="label" id="d08-label" data-var-text="label">Development</span>
      </div>
      <div class="kw"><span id="d08-k1" data-var-text="k1">Learning</span></div>
      <div class="kw"><span id="d08-k2" data-var-text="k2">Growth</span></div>
      <div class="kw"><span id="d08-k3" data-var-text="k3">Opportunities</span></div>
    </div>
  </div>
  <script>
    (function () {
      const v = {"num":"08 / 17","side":"left","variant":"2","dur":4.45}; // side, entrance variant and card length, written by tools/build-cards.mjs
      const root = document.getElementById("d08-scrim").parentElement;
      const $ = (s) => root.querySelector(s);
      const right = v.side === "right";
      if (right) root.classList.add("right");
      root.style.setProperty("--scrim-dir", right ? "to left" : "to right");
      $("#d08-ghost").textContent = String(v.num || "").split("/")[0].trim();

      const dur = Number(v.dur) || 5;
      const variant = String(v.variant || "1");
      const gold = "#fcd400";
      const kws = [$("#d08-k1"), $("#d08-k2"), $("#d08-k3")];
      const gap = Math.min(1.0, Math.max(0.4, (dur - 2.0) / 3.2));
      const xIn = right ? 40 : -40;

      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#d08-scrim", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.out" }, 0);
      tl.fromTo("#d08-ghost", { opacity: 0, x: xIn * 2 }, { opacity: 1, x: 0, duration: 0.9, ease: "expo.out" }, 0.05);
      tl.fromTo("#d08-ghost", { y: 0 }, { y: -26, duration: Math.max(1, dur - 0.4), ease: "none" }, 0.05);
      tl.fromTo("#d08-bar", { scaleX: 0 }, { scaleX: 1, duration: 0.45, ease: "expo.out" }, 0.1);
      tl.fromTo(["#d08-num", "#d08-label"], { opacity: 0, filter: "blur(6px)" },
        { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power2.out", stagger: 0.07 }, 0.15);

      kws.forEach((el, i) => {
        const t = 0.4 + i * gap;
        if (variant === "2") {
          tl.fromTo(el, { yPercent: 115, opacity: 1, color: gold }, { yPercent: 0, duration: 0.6, ease: "expo.out" }, t);
        } else if (variant === "3") {
          tl.fromTo(el, { opacity: 0, scaleX: 1.35, filter: "blur(8px)", color: gold, transformOrigin: right ? "right center" : "left center" },
            { opacity: 1, scaleX: 1, filter: "blur(0px)", duration: 0.6, ease: "expo.out" }, t);
        } else {
          tl.fromTo(el, { opacity: 0, filter: "blur(10px)", color: gold },
            { opacity: 1, filter: "blur(0px)", duration: 0.25, ease: "power2.out" }, t);
        }
        // the newest keyword holds the gold accent; earlier ones settle to white
        if (i > 0) tl.to(kws[i - 1], { color: "#ffffff", duration: 0.3, ease: "power1.out" }, t);
      });

      const out = Math.max(0.4 + 2 * gap + 0.7, dur - 0.4);
      tl.to("#d08-block", { opacity: 0, filter: "blur(8px)", duration: 0.3, ease: "power3.in" }, out);
      tl.to("#d08-scrim", { opacity: 0, duration: 0.35, ease: "power2.in" }, out);
      window.__timelines["dim-08"] = tl;
    })();
  </script>
