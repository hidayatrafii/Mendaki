      /* MENDAKI brand: yellow, charcoal, teal (mendaki.org.sg) */
      :root {
        --yellow: #fdd901;
        --charcoal: #1a1b1e;
        --teal: #26b6c6;
        --ink: #ffffff;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        font-family: "Poppins", sans-serif;
      }
      /* the footage sits in an untimed wrapper so cuts can punch in without touching the video */
      #footage-wrap {
        position: absolute;
        inset: 0;
        overflow: hidden;
      }
      #footage-cam {
        position: absolute;
        inset: 0;
        transform-origin: 50% 50%;
      }
      #root video {
        position: absolute;
        left: 0;
        top: 0;
        width: 1920px;
        height: 1080px;
        object-fit: cover;
      }
    </style>
  </head>
