<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:P;src:url(../fonts/Poppins-ExtraBold.ttf);font-weight:800}
@font-face{font-family:P;src:url(../fonts/Poppins-Medium.ttf);font-weight:500}
html,body{margin:0;width:1080px;height:1920px;background:transparent;font-family:P}
.wrap{position:absolute;left:0;right:0;top:1060px;transform:translateY(-50%);display:flex;justify-content:center}
.card{display:flex;background:rgba(10,30,60,.92);border-radius:14px;overflow:hidden;max-width:780px;box-sizing:border-box;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.bar{width:10px;background:#E8A317;flex:none}
.in{padding:20px 34px 22px 28px;text-align:left}
.big{white-space:nowrap;color:#EEDCA2;font-weight:800;font-size:64px;line-height:1.08;letter-spacing:.3px}
.small{color:#fff;font-weight:500;font-size:28px;line-height:1.3;margin-top:8px}
</style></head><body><div class="wrap"><div class="card"><div class="bar"></div><div class="in">
<div class="big" id="b"></div><div class="small" id="s"></div></div></div></div></body></html>
